stages:
  - build
  - deploy
  - cleanup

variables:
  CI_PROJECT_NAME: youdescribex-app
  DOCKER_REGISTRY: youdescribe
  CI_REGISTRY: docker.io
  IMAGE_NAME: '${DOCKER_REGISTRY}/${CI_PROJECT_NAME}'

services:
  - docker:24.0.5-dind

before_script:
  - echo "Using pre-installed Docker Compose..."
  - docker-compose --version
  - echo "Logging into Docker..."
  - echo "$DOCKER_REGISTRY_PASSWORD" | docker login -u "$DOCKER_REGISTRY_USER" --password-stdin $CI_REGISTRY

.build_template: &build_template
  stage: build
  script:
    - echo "Building Docker image..."
    - docker build
      --build-arg REACT_APP_REDIRECT_URL="$REACT_APP_REDIRECT_URL"
      --build-arg REACT_APP_YDX_BACKEND_URL="$REACT_APP_YDX_BACKEND_URL"
      --build-arg REACT_APP_YOUTUBE_API_URL="$REACT_APP_YOUTUBE_API_URL"
      --build-arg REACT_APP_YOUTUBE_API_KEY="$REACT_APP_YOUTUBE_API_KEY"
      --build-arg REACT_APP_LOGROCKET_ID="$REACT_APP_LOGROCKET_ID"
      --build-arg REACT_APP_GOOGLE_CLIENT_ID="$REACT_APP_GOOGLE_CLIENT_ID"
      --build-arg REACT_APP_USE_YDX="$REACT_APP_USE_YDX"
      --build-arg REACT_APP_CLASSIC_BACKEND_URL="$REACT_APP_CLASSIC_BACKEND_URL"
      --build-arg REACT_APP_CLASSIC_BACKEND_URL_VERSION="$REACT_APP_CLASSIC_BACKEND_URL_VERSION"
      --build-arg REACT_APP_ENVIRONMENT="$REACT_APP_ENVIRONMENT"
      -t "${IMAGE_NAME}:${IMAGE_TAG}" .
    - docker push "${IMAGE_NAME}:${IMAGE_TAG}"
    - echo "Build complete"

build_dev:
  <<: *build_template
  variables:
    IMAGE_TAG: dev-latest
    REACT_APP_REDIRECT_URL: $REACT_APP_REDIRECT_URL_DEV
    REACT_APP_YDX_BACKEND_URL: $REACT_APP_YDX_BACKEND_URL_DEV
    REACT_APP_YOUTUBE_API_URL: $REACT_APP_YOUTUBE_API_URL_DEV
    REACT_APP_YOUTUBE_API_KEY: $REACT_APP_YOUTUBE_API_KEY_DEV
    REACT_APP_ENVIRONMENT: development
  tags:
    - frontend
    - dev
  only:
    - dev

build_prod:
  <<: *build_template
  variables:
    IMAGE_TAG: prod-latest
    REACT_APP_REDIRECT_URL: $REACT_APP_REDIRECT_URL_PROD
    REACT_APP_YDX_BACKEND_URL: $REACT_APP_YDX_BACKEND_URL_PROD
    REACT_APP_YOUTUBE_API_URL: $REACT_APP_YOUTUBE_API_URL_PROD
    REACT_APP_YOUTUBE_API_KEY: $REACT_APP_YOUTUBE_API_KEY_PROD
    REACT_APP_ENVIRONMENT: production
  tags:
    - frontend
    - prod
  only:
    - main

.deploy_template: &deploy_template
  stage: deploy
  retry: 2
  script:
    - echo "Deploying to $CI_ENVIRONMENT_NAME environment..."
    - docker-compose --version
    - docker-compose -f docker-compose.yml config
    - docker-compose -f docker-compose.yml pull || { echo "Failed to pull images"; exit 1; }
    - docker-compose -f docker-compose.yml down || { echo "Failed to stop existing containers"; exit 1; }
    - docker-compose -f docker-compose.yml up -d --remove-orphans || { echo "Failed to start containers"; exit 1; }
    - docker-compose -f docker-compose.yml ps

deploy_dev:
  <<: *deploy_template
  variables:
    IMAGE_TAG: dev-latest
  environment:
    name: dev
  tags:
    - frontend
    - dev
  only:
    - dev
  dependencies:
    - build_dev

deploy_prod:
  <<: *deploy_template
  variables:
    IMAGE_TAG: prod-latest
  environment:
    name: prod
  tags:
    - frontend
    - prod
  only:
    - main
  dependencies:
    - build_prod

cleanup:
  stage: cleanup
  script:
    - echo "Cleaning up old images..."
    - docker container prune -f
    - docker image prune -af
  tags:
    - frontend
  rules:
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"
      when: always
